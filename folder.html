{{- $name := .Get "name" -}}
{{- $state := .Get "state" | default "open" }}
<li>
  <button class="folder {{ $state }}">
    <svg class="folder-closed" width="1em" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5A2 2 0 003 7z"></path>
    </svg>
    <svg class="folder-open" width="1em" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z">
      </path>
    </svg>
    <span>{{ $name }}</span>
  </button>
  <ul class="{{ $state }}">
    {{- .InnerDeindent -}}
  </ul>
</li>
